name: Release

# Push a tag like v0.1.0 to build, test and publish a GitHub Release with the APK attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with the owner's key when the ANDROID_KEYSTORE_BASE64 secret exists,
      # otherwise the build falls back to the Android debug keystore (see README, "Install").
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the owner's release keystore."
          else
            echo "No keystore secret: the APK will be debug-signed."
          fi

      - name: Unit tests and release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace \
            -PappVersionName="${GITHUB_REF_NAME#v}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Prepare assets and release notes
        run: |
          mkdir -p release-out
          APK="release-out/MusicPlayer-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd release-out && sha256sum "MusicPlayer-${GITHUB_REF_NAME}.apk" > "MusicPlayer-${GITHUB_REF_NAME}.apk.sha256")
          # CHANGELOG.md section "## <tag> ..." up to the next "## " heading; fallback text if there is none.
          awk -v v="$GITHUB_REF_NAME" '$1 == "##" && $2 == v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > release-out/notes.md
          if [ ! -s release-out/notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md for details." > release-out/notes.md
          fi
          {
            echo
            echo "### Install"
            echo "Download \`MusicPlayer-${GITHUB_REF_NAME}.apk\`, allow installs from this source, open it."
            echo "Unless the maintainer configured a release keystore, the APK is **debug-signed**: installing it over an"
            echo "APK signed with a different key requires uninstalling the old one first."
            echo
            echo "Licensed under the MIT License; bundled fonts are SIL OFL 1.1 (see the repository)."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "release-out/MusicPlayer-${GITHUB_REF_NAME}.apk.sha256")\`"
          } >> release-out/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in
            *-* | v0.*) FLAGS="--prerelease" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "release-out/MusicPlayer-${GITHUB_REF_NAME}.apk" "release-out/MusicPlayer-${GITHUB_REF_NAME}.apk.sha256"
          else
            gh release create "$GITHUB_REF_NAME" $FLAGS \
              --title "Music Player ${GITHUB_REF_NAME}" \
              --notes-file release-out/notes.md \
              --verify-tag \
              "release-out/MusicPlayer-${GITHUB_REF_NAME}.apk" "release-out/MusicPlayer-${GITHUB_REF_NAME}.apk.sha256"
          fi
