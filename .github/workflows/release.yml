name: Release

# Push a tag like v0.1.0, or run this workflow manually (Actions tab > Release > Run workflow, give the version),
# to build, test and publish a GitHub Release with the APK attached.
# A manual run creates the tag itself, at the commit of the branch you ran it on.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (creates tag v<version>)"
        type: string
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # TAG is the pushed tag, or v<version> for a manual run (input passed via env, never interpolated into the script).
      - name: Resolve tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Bad version/tag: $TAG" >&2; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with the owner's key when the ANDROID_KEYSTORE_BASE64 secret exists,
      # otherwise the build falls back to the Android debug keystore (see README, "Install").
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the owner's release keystore."
          else
            echo "No keystore secret: the APK will be debug-signed."
          fi

      - name: Unit tests and release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace \
            -PappVersionName="${TAG#v}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Prepare assets and release notes
        run: |
          mkdir -p release-out
          APK="release-out/MusicPlayer-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd release-out && sha256sum "MusicPlayer-${TAG}.apk" > "MusicPlayer-${TAG}.apk.sha256")
          # CHANGELOG.md section "## <tag> ..." up to the next "## " heading; fallback text if there is none.
          awk -v v="$TAG" '$1 == "##" && $2 == v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > release-out/changes.md
          if [ ! -s release-out/changes.md ]; then
            echo "Release ${TAG}. See CHANGELOG.md for details." > release-out/changes.md
          fi
          {
            echo "## Mowj ${TAG}"
            echo
            cat release-out/changes.md
            echo
            echo "### Install"
            echo "Download \`MusicPlayer-${TAG}.apk\`, allow installs from this source, open it."
            echo "Unless the maintainer configured a release keystore, the APK is **debug-signed**: installing it over an"
            echo "APK signed with a different key requires uninstalling the old one first."
            echo
            echo "Licensed under the MIT License; bundled fonts are SIL OFL 1.1 (see the repository)."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "release-out/MusicPlayer-${TAG}.apk.sha256")\`"
          } >> release-out/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pre-release only when the version has a suffix (v1.0.0-rc.1); every other release is stable and "latest".
          case "$TAG" in
            *-*) PRE=true; LATEST="" ;;
            *) PRE=false; LATEST="--latest" ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run: upload the assets again and correct the flags.
            gh release upload "$TAG" --clobber \
              "release-out/MusicPlayer-${TAG}.apk" "release-out/MusicPlayer-${TAG}.apk.sha256"
            gh release edit "$TAG" --prerelease="$PRE" $LATEST
          else
            # Manual run: the tag may not exist yet, so let GitHub create it at this commit. Tag push: it must already exist.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              TAGFLAG="--target $GITHUB_SHA"
            else
              TAGFLAG="--verify-tag"
            fi
            gh release create "$TAG" $TAGFLAG --prerelease="$PRE" $LATEST \
              --title "Mowj ${TAG}" \
              --notes-file release-out/notes.md \
              "release-out/MusicPlayer-${TAG}.apk" "release-out/MusicPlayer-${TAG}.apk.sha256"
          fi
