plugins {
    alias(libs.plugins.android.application)
}

// Release signing: RELEASE_KEYSTORE_FILE / _PASSWORD / RELEASE_KEY_ALIAS / _PASSWORD from gradle properties or env.
// Without them the release APK is signed with the Android debug keystore (installable, but not a store key).
def releaseProp = { String name -> project.findProperty(name) ?: System.getenv(name) }
def releaseKeystore = releaseProp('RELEASE_KEYSTORE_FILE')

android {
    namespace 'com.mhrsdev.musicplayer'
    compileSdkVersion 'android-37.0'

    defaultConfig {
        applicationId 'com.mhrsdev.musicplayer'
        minSdk 26
        targetSdk 37
        versionCode = Integer.parseInt("${project.findProperty('appVersionCode') ?: '1'}")
        versionName = "${project.findProperty('appVersionName') ?: '0.1.0'}"
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseProp('RELEASE_KEYSTORE_PASSWORD')
                keyAlias releaseProp('RELEASE_KEY_ALIAS')
                keyPassword releaseProp('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError true
        checkDependencies true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.activity
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.recyclerview
    implementation libs.androidx.constraintlayout
    implementation libs.material

    implementation libs.media3.exoplayer
    implementation libs.media3.session

    testImplementation libs.junit
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.org.json // real org.json for JVM tests (android.jar's is a stub)
    testImplementation libs.robolectric
}
