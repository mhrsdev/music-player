<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><script src="options.js"></script><script src="brand.js"></script>
<style>
#shot{width:1280px;height:640px;position:relative;overflow:hidden;background:#0F1216;color:var(--foam);display:flex;align-items:center}
.glow{position:absolute;inset:0;background:radial-gradient(640px 420px at 22% 50%, rgba(36,84,140,.55), transparent 70%),radial-gradient(520px 360px at 88% 110%, rgba(14,140,132,.35), transparent 70%)}
.wave{position:absolute;left:0;right:0;bottom:84px;opacity:.9}
.icon{position:relative;margin-left:112px;filter:drop-shadow(0 24px 48px rgba(0,0,0,.45))}
.text{position:relative;margin-left:72px}
.en{font-family:GSF;font-weight:640;font-size:132px;letter-spacing:-3px;line-height:1}
.fa{display:inline-block;font-family:Vazirmatn;font-weight:800;font-size:76px;line-height:1.3;color:#7FD6CB;margin-top:8px}
.tag{font-family:GSF;font-weight:420;font-size:30px;white-space:nowrap;color:var(--mist);margin-top:18px}
</style></head>
<body data-out="social-preview.png"><div id="shot"><div class="glow"></div>
<svg class="wave" viewBox="0 0 1280 40" height="40" width="1280"><path id="wv" fill="none" stroke="#30353C" stroke-width="6" stroke-linecap="round"/><path id="wv2" fill="none" stroke="#7FD6CB" stroke-width="6" stroke-linecap="round"/><circle cx="560" cy="20" r="12" fill="#F2FAFF"/></svg>
<div class="icon" id="ic"></div>
<div class="text"><div class="en">Mowj</div><div><span class="fa" dir="rtl">موج</span></div><div class="tag">A calm, fast local music player for Android.</div></div></div>
<script>
ic.innerHTML = icon(300, 'rounded');
// Echo of the in-app Wavy seek bar: played part waves, the rest is a flat track.
let d='M24 20', x=24; for(; x<=548; x+=4) d+=` L${x} ${20+9*Math.sin((x-24)/22)}`;
wv2.setAttribute('d', d); wv.setAttribute('d','M572 20 L1256 20');
</script></body></html>
