  <defs>
    <linearGradient id="mowj-g" gradientUnits="userSpaceOnUse" x1="0" y1="35" x2="64" y2="3">
      <stop offset="0" stop-color="#2F5F95"/>
      <stop offset="1" stop-color="#0E8C84"/>
    </linearGradient>
  </defs>
  <path d="M2 35 C9 35 10 27 17 27 C24 27 24 35 31 35 C42 35 37 3 51 3 A12 12 0 0 1 63 15 A12 12 0 0 1 51 27 A6 6 0 0 1 45 21"
        fill="none" stroke="url(#mowj-g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
