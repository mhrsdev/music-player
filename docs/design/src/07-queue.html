<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Queue</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="player.css">
<style>
  .screen { --dyn: #A9D4F5; --on-dyn: #00344D; --dyn-shadow: rgba(20,90,140,.75); --tintc: #1f5f86; }
  .scrim { background: linear-gradient(180deg, rgba(4,14,26,.3), rgba(4,14,26,.55)); }
  .cp { position: absolute; top: 104px; left: 20px; right: 16px; display: flex; align-items: center; gap: 14px; }
  .cp .tt { flex: 1; min-width: 0; }
  .cp .tt .h { font-size: 21px; line-height: 26px; font-weight: 600; letter-spacing: -.3px; }
  .cp .tt .s { font-size: 14px; color: rgba(255,255,255,.72); }
  .sk { position: absolute; top: 190px; left: 20px; width: 372px; }
  .qs { position: absolute; top: 262px; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--ink1); border-radius: 28px 28px 0 0; box-shadow: 0 -12px 36px rgba(0,0,0,.4), inset 0 1px 0 var(--line2); color: var(--text); }
  .qs .handle { width: 32px; height: 4px; border-radius: 4px; background: var(--text3); opacity: .7; margin: 10px auto 0; }
  .qh { display: flex; align-items: flex-start; justify-content: space-between; padding: 10px 8px 8px 20px; }
  .sleep { height: 40px; padding: 0 12px 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 560; color: var(--dyn); background: rgba(169,212,245,.10); font-feature-settings: 'tnum' 1; }
  .list { position: relative; }
  .q { display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 6px 0 20px; position: relative; background: var(--ink1); }
  .q .txt { flex: 1; min-width: 0; }
  .q .d { font-size: 13px; color: var(--text3); font-feature-settings: 'tnum' 1; }
  .q .h { width: 44px; height: 48px; display: grid; place-items: center; color: var(--text3); }
  .q.now .t-title { color: var(--dyn); }
  .q.drag { position: absolute; left: 10px; right: 10px; top: 176px; z-index: 5; background: var(--ink3); border-radius: 18px; transform: rotate(-1.2deg) scale(1.03); box-shadow: 0 22px 40px -10px rgba(0,0,0,.7), inset 0 0 0 1px var(--line2); padding-left: 10px; }
  .q.drag .h { color: var(--text); }
  .slot { height: 64px; margin: 0 14px; border-radius: 16px; background: repeating-linear-gradient(90deg, var(--line2) 0 6px, transparent 6px 11px) top/100% 1.5px no-repeat, repeating-linear-gradient(90deg, var(--line2) 0 6px, transparent 6px 11px) bottom/100% 1.5px no-repeat; }
  .swipe { position: relative; height: 64px; background: var(--danger-ink); overflow: hidden; }
  .swipe .del { position: absolute; right: 14px; top: 0; bottom: 0; display: flex; align-items: center; gap: 8px; color: var(--danger); font-size: 14px; font-weight: 560; }
  .swipe .q { position: absolute; left: -104px; right: 104px; top: 0; border-radius: 0 18px 18px 0; }
  .sep { height: 1px; background: var(--line); margin: 6px 20px; }
  .toast { bottom: 26px; }
</style></head>
<body><div class="screen theme-dark pl">
  <div class="backdrop"><div class="art" data-art="without-you"></div></div>
  <div class="tint"></div><div class="backdrop-scrim scrim"></div><div class="grain"></div>
  <div class="layer">
    <div class="statusbar"></div>
    <div class="top" style="top:42px">
      <div class="ib"><i class="g" data-g="chevd"></i></div>
      <div class="from"><div class="a">Playing from artist</div><div class="b">NEFFEX</div></div>
      <div class="ib"><i class="g" data-g="more"></i></div>
    </div>
    <div class="cp">
      <div class="art sl10 edge" data-art="without-you" style="width:60px;height:60px"></div>
      <div class="tt"><div class="h ell">Without You</div><div class="s">NEFFEX</div></div>
      <div class="disc play" style="width:56px;height:56px;box-shadow:0 0 0 5px rgba(169,212,245,.13),0 10px 22px -8px rgba(20,90,140,.8)"><span class="glyph" data-t="1" data-s="26" data-c="#00344D"></span></div>
      <div class="ib" style="color:#fff"><i class="g s28" data-g="next"></i></div>
    </div>
    <div class="sk"><div class="seek" data-w="372" data-h="24" data-p=".31" data-c="#A9D4F5" data-t="rgba(255,255,255,.26)" data-sw="3" data-amp="2.6" data-wl="22" data-r="7" data-ph=".6"></div><div class="times" style="margin-top:6px"><span>1:00</span><span>−2:10</span></div></div>
  </div>
  <div class="qs">
    <div class="handle"></div>
    <div class="qh">
      <div><div class="t-section">Up next</div><div class="t-meta num">NEFFEX · 12 songs · 1 h 18 min left</div></div>
      <div style="display:flex;align-items:center;gap:2px"><div class="sleep"><i class="g s18" data-g="moon.f"></i>23 min</div><div class="ib" style="color:var(--text2)"><i class="g" data-g="shuffle"></i></div></div>
    </div>
    <div class="list">
      <div class="q now"><div class="art sl8" data-art="without-you" style="width:44px;height:44px"><div class="live"><i style="height:12px"></i><i style="height:20px"></i><i style="height:9px"></i><i style="height:16px"></i></div></div><div class="txt"><div class="t-title ell">Without You</div><div class="t-meta ell">Now playing</div></div><div class="d">3:10</div><div class="h"></div></div>
      <div class="sep"></div>
      <div class="q"><div class="art sl8 edge" data-art="grateful" style="width:44px;height:44px"></div><div class="txt"><div class="t-title ell">Grateful</div><div class="t-meta ell">NEFFEX</div></div><div class="d">3:09</div><div class="h"><i class="g" data-g="drag"></i></div></div>
      <div class="slot"></div>
      <div class="q drag"><div class="art sl8" data-art="fight-back" style="width:44px;height:44px"></div><div class="txt"><div class="t-title ell">Fight Back</div><div class="t-meta ell">NEFFEX</div></div><div class="d">3:17</div><div class="h"><i class="g" data-g="drag"></i></div></div>
      <div class="q"><div class="art sl8 edge" data-art="cold" style="width:44px;height:44px"></div><div class="txt"><div class="t-title ell">Cold</div><div class="t-meta ell">NEFFEX</div></div><div class="d">2:58</div><div class="h"><i class="g" data-g="drag"></i></div></div>
      <div class="swipe"><div class="del"><i class="g s20" data-g="trash"></i>Remove</div><div class="q"><div class="art sl8" data-art="without-you" data-zoom="1.4" style="width:44px;height:44px"></div><div class="txt"><div class="t-title ell">Best of Me</div><div class="t-meta ell">NEFFEX</div></div><div class="d">4:05</div><div class="h"><i class="g" data-g="drag"></i></div></div></div>
      <div class="q"><div class="art sl8 edge" data-art="cold" data-zoom="1.6" data-origin="20% 80%" style="width:44px;height:44px"></div><div class="txt"><div class="t-title ell">Cold (Acoustic)</div><div class="t-meta ell">NEFFEX</div></div><div class="d">3:04</div><div class="h"><i class="g" data-g="drag"></i></div></div>
      <div class="q"><div class="art sl8 edge" data-art="mercury" style="width:44px;height:44px"></div><div class="txt"><div class="t-title ell">Mercury</div><div class="t-meta ell">Oslo Haze</div></div><div class="d">3:20</div><div class="h"><i class="g" data-g="drag"></i></div></div>
    </div>
    <div class="toast"><span>Queue shuffled</span><span class="act">Undo</span></div>
  </div>
  <div class="gesture" style="--gh:var(--text)"></div>
</div>
<script src="lib.js"></script><script>buildMock()</script></body></html>
