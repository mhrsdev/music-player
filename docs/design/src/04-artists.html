<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Artists</title><link rel="stylesheet" href="base.css">
<style>
  .bar { position: absolute; top: 40px; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 2px; padding: 0 8px; z-index: 10; }
  .bar .t { flex: 1; font-size: 22px; font-weight: 560; letter-spacing: -.3px; margin-left: 4px; }
  .sortb { display: inline-flex; height: 40px; align-items: center; gap: 4px; padding: 0 8px 0 12px; font-size: 14px; font-weight: 500; color: var(--text2); }
  .grid { position: absolute; top: 112px; left: 0; right: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 14px; padding: 4px 20px; }
  .a .art { width: 179px; height: 200px; }
  .a .n { margin-top: 10px; font-size: 16px; font-weight: 520; line-height: 22px; }
  .a .n.fa { font-size: 15.5px; font-weight: 650; line-height: 26px; }
  .a .c { font-size: 13px; color: var(--text2); }
  .a .wrap { position: relative; }
  .a .wrap svg.o { position: absolute; inset: 0; pointer-events: none; }
</style></head>
<body><div class="screen theme-dark">
  <div class="statusbar"></div>
  <div class="bar"><div class="ib"><i class="g" data-g="back"></i></div><div class="t">Artists</div><div class="sortb">A–Z<i class="g s18" data-g="chevd"></i></div><div class="ib"><i class="g" data-g="search"></i></div></div>
  <div class="grid">
    <div class="a"><div class="art arch" data-r="14" data-art="tehran-nights" data-zoom="2.0" data-origin="66% 50%"></div><div class="n fa" dir="rtl" style="text-align:left">آوا نیک‌زاد</div><div class="c">10 songs · 1 album</div></div>
    <div class="a"><div class="art arch" data-r="14" data-art="koucheh-bagh" data-zoom="1.7" data-origin="50% 30%"></div><div class="n fa" dir="rtl" style="text-align:left">گروه دریاچه</div><div class="c">8 songs · 1 album</div></div>
    <div class="a"><div class="art arch" data-r="14" data-art="electric-dusk" data-zoom="1.9" data-origin="50% 40%"></div><div class="n">Halcyon Drift</div><div class="c">14 songs · 2 albums</div></div>
    <div class="a"><div class="art arch" data-r="14" data-art="desert-bloom" data-zoom="1.8" data-origin="62% 58%"></div><div class="n">Kaveh Rostami</div><div class="c">6 songs · 1 album</div></div>
    <div class="a"><div class="art arch" data-r="14" data-art="topography" data-zoom="1.8" data-origin="36% 42%"></div><div class="n">Mira Vale</div><div class="c">11 songs · 1 album</div></div>
    <div class="a"><div class="art arch" data-r="14" data-art="without-you" data-zoom="1.9" data-origin="62% 40%"></div><div class="n">NEFFEX</div><div class="c">38 songs · 4 albums</div></div>
  </div>
  <div class="deckwrap"></div>
  <div class="deck" data-on="library"></div>
  <div class="gesture"></div>
</div>
<script src="lib.js"></script><script>buildMock()</script></body></html>
