<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Search</title><link rel="stylesheet" href="base.css">
<style>
  .content { position: absolute; inset: 40px 0 0 0; }
  .field { margin: 14px 16px 0; height: 52px; border-radius: 999px; background: var(--ink2); display: flex; align-items: center; gap: 12px; padding: 0 4px 0 18px; box-shadow: inset 0 0 0 1px var(--line); }
  .field .q { flex: 1; font-size: 16.5px; font-weight: 420; }
  .field .caret { display: inline-block; width: 2px; height: 21px; background: var(--accent); vertical-align: -4px; margin-left: 1px; border-radius: 2px; }
  .tabs { margin-top: 10px; }
  .spot { position: relative; margin: 10px 0 6px; padding: 14px 16px 14px 20px; display: flex; gap: 16px; align-items: center; }
  .spot .bg { position: absolute; left: -40px; top: -60px; width: 360px; height: 240px; background: radial-gradient(closest-side, rgba(134,172,210,.20), transparent); pointer-events: none; }
  .spot .k { font-size: 12px; color: var(--text2); }
  .spot .h { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -.5px; }
  mark { background: none; color: var(--text); font-weight: 650; }
  .row .t-title { font-weight: 380; color: var(--text2); }
  .lbl { padding: 10px 20px 4px; }
</style></head>
<body><div class="screen theme-dark">
  <div class="statusbar"></div>
  <div class="content">
    <div class="field"><i class="g" data-g="search" style="color:var(--text2)"></i><div class="q">cold<span class="caret"></span></div><div class="ib" style="color:var(--text2)"><i class="g s20" data-g="close"></i></div></div>
    <div class="tabs">
      <div class="tb on"><span>Songs<span class="c">14</span></span><span class="tick"></span></div><div class="tb"><span>Albums<span class="c">2</span></span></div><div class="tb"><span>Artists<span class="c">1</span></span></div><div class="tb"><span>Playlists</span></div><div class="tb"><span>Folders</span></div>
    </div>
    <div class="spot">
      <div class="bg"></div>
      <div class="art sl12 edge" data-art="cold" style="width:92px;height:92px"></div>
      <div style="flex:1;min-width:0;position:relative">
        <div class="k">Top result · song</div>
        <div class="h">Cold</div>
        <div class="t-meta"><span class="badge-e">E</span>NEFFEX · 2:58</div>
      </div>
      <div class="disc solid" style="width:54px;height:54px;box-shadow:0 0 0 6px var(--accent-soft)"><i class="g s28" data-g="play"></i></div>
    </div>
    <div class="lbl t-label">Songs</div>
    <div class="row"><div class="art sl8 edge" data-art="salt-static" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell"><mark>Cold</mark> Water Static</div><div class="t-meta ell">The Low Tides</div></div><div class="ib more"><i class="g" data-g="more"></i></div></div>
    <div class="row"><div class="art sl8 edge" data-art="topography" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell"><mark>Cold</mark> Light</div><div class="t-meta ell"><span class="badge-e">E</span>Mira Vale</div></div><div class="ib more"><i class="g" data-g="more"></i></div></div>
    <div class="row"><div class="art sl8 edge" data-art="electric-dusk" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell"><mark>Cold</mark>er Nights (Extended Mix)</div><div class="t-meta ell">Halcyon Drift</div></div><div class="ib more"><i class="g" data-g="more"></i></div></div>
    <div class="row"><div class="art sl8 edge" data-art="paper-planes" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell"><mark>Cold</mark> Coffee &amp; Rain</div><div class="t-meta ell">Juniper Lane</div></div><div class="ib more"><i class="g" data-g="more"></i></div></div>
    <div class="row"><div class="art sl8 edge" data-art="mercury" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell">So <mark>Cold</mark></div><div class="t-meta ell"><span class="badge-e">E</span>Oslo Haze</div></div><div class="ib more"><i class="g" data-g="more"></i></div></div>
    <div class="row"><div class="art sl8 edge" data-art="fight-back" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell">Out in the <mark>Cold</mark></div><div class="t-meta ell"><span class="badge-e">E</span>NEFFEX</div></div><div class="ib more"><i class="g" data-g="more"></i></div></div>
    <div class="row"><div class="art sl8 edge" data-art="cold" data-zoom="1.6" data-origin="20% 80%" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell"><mark>Cold</mark> (Acoustic)</div><div class="t-meta ell">NEFFEX</div></div><div class="ib more"><i class="g" data-g="more"></i></div></div>
  </div>
  <div class="deckwrap"></div>
  <div class="deck" data-on="search"></div>
  <div class="gesture"></div>
</div>
<script src="lib.js"></script><script>buildMock()</script></body></html>
