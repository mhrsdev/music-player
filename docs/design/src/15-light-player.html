<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Player light</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="player.css">
<style>
  .screen { --dyn: #1F4D86; --on-dyn: #FFFFFF; --dyn-shadow: rgba(31,77,134,.55); --tintc: #2a5db0; color: #121A2C; --sb: #121A2C; }
  .pl { color: #121A2C; --sb: #121A2C; }
  .scrim { background: linear-gradient(180deg, rgba(244,241,234,.72) 0%, rgba(244,241,234,.6) 36%, rgba(244,241,234,.86) 60%, rgba(244,241,234,.95) 100%); }
  .pl .tint { opacity: .22; }
  .pl .from .a, .pl .upnext .a { color: #4E566A; }
  .pl .meta .t-display { color: #121A2C; }
  .pl .meta .artist { color: #4E566A; }
  .times { color: #4E566A; }
  .disc.glass { background: rgba(21,27,44,.06); box-shadow: inset 0 0 0 1px rgba(21,27,44,.10); color: #121A2C; }
  .capsule { background: rgba(21,27,44,.06); box-shadow: inset 0 0 0 1px rgba(21,27,44,.09); }
  .pl .upnext { background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(21,27,44,.08), 0 8px 20px -12px rgba(31,77,134,.4); }
  .play { background: radial-gradient(120% 120% at 50% 12%, #3c6fb0 0%, #1F4D86 60%) !important; }
  .pl .cover { box-shadow: 0 30px 50px -22px rgba(31,77,134,.7); }
</style></head>
<body><div class="screen theme-light pl">
  <div class="backdrop"><div class="art" data-art="koucheh-bagh"></div></div>
  <div class="tint"></div><div class="backdrop-scrim scrim"></div><div class="grain" style="opacity:.06"></div>
  <div class="layer">
    <div class="statusbar"></div>
    <div class="top">
      <div class="ib"><i class="g" data-g="chevd"></i></div>
      <div class="from"><div class="a">Playing from playlist</div><div class="b">Rainy evenings</div></div>
      <div class="ib"><i class="g" data-g="more"></i></div>
    </div>
    <div class="cover art sl20 edge" data-art="koucheh-bagh"></div>
    <div class="meta">
      <div style="min-width:0;flex:1"><div class="t-display fa ell" dir="rtl" style="text-align:left">کوچه‌باغ</div><div class="artist fa" dir="rtl" style="text-align:left;font-family:Vazirmatn">گروه دریاچه</div></div>
      <div class="ib" style="color:#1F4D86"><i class="g s28" data-g="heart"></i></div>
    </div>
    <div class="seekwrap">
      <div class="seek" data-w="364" data-h="54" data-p=".58" data-style="waveform" data-c="#1F4D86" data-t="rgba(21,27,44,.09)" data-hot="#ffffff" data-seed="5"></div>
      <div class="times"><span>2:17</span><span>−1:39</span></div>
    </div>
    <div class="transport">
      <div class="ib"><i class="g" data-g="shuffle"></i></div>
      <div class="disc glass" style="width:64px;height:64px"><i class="g s28" data-g="prev"></i></div>
      <div class="disc play" style="width:88px;height:88px"><span class="glyph" data-t="0" data-s="34" data-c="#FFFFFF"></span></div>
      <div class="disc glass" style="width:64px;height:64px"><i class="g s28" data-g="next"></i></div>
      <div class="ib"><i class="g" data-g="repeat"></i></div>
    </div>
    <div class="actions">
      <div class="capsule"><i class="g s20" data-g="speaker"></i>This phone</div>
      <div style="display:flex;gap:4px"><div class="ib"><i class="g" data-g="moon"></i></div><div class="ib"><i class="g" data-g="lyrics"></i></div></div>
    </div>
    <div class="upnext">
      <div class="art sl8" data-art="baran" style="width:36px;height:36px"></div>
      <div class="tx"><div class="a">Up next</div><div class="b ell"><span style="font-family:Vazirmatn">باران که می‌آید</span> · <span style="font-family:Vazirmatn">نیلوفر</span></div></div>
      <i class="g s20" data-g="chevu" style="opacity:.6"></i>
    </div>
  </div>
  <div class="gesture" style="--gh:#121A2C"></div>
</div>
<script src="lib.js"></script><script>buildMock()</script></body></html>
