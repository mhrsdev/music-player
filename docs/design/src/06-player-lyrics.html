<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Lyrics</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="player.css">
<style>
  .screen { --dyn: #FFB0CD; --on-dyn: #5E1133; --dyn-shadow: rgba(160,30,90,.75); --tintc: #a3346c; }
  .scrim { background: linear-gradient(180deg, rgba(22,5,24,.6) 0%, rgba(22,5,24,.6) 46%, rgba(22,5,24,.74) 66%, rgba(22,5,24,.9) 100%); }
</style></head>
<body><div class="screen theme-dark pl">
  <div class="backdrop"><div class="art" data-art="electric-dusk"></div></div>
  <div class="tint"></div><div class="backdrop-scrim scrim"></div><div class="grain"></div>
  <div class="layer">
    <div class="statusbar"></div>
    <div class="top">
      <div class="ib"><i class="g" data-g="chevd"></i></div>
      <div class="from"><div class="a">Playing from album</div><div class="b">Electric Dusk</div></div>
      <div class="ib"><i class="g" data-g="more"></i></div>
    </div>
    <div class="lyr">
      <p class="ln past" style="margin-top:26px">Streetlights hum a borrowed tune</p>
      <p class="ln past">I count the windows, one by one</p>
      <p class="ln act"><span class="done">You said the night </span><span class="cur">would</span> wait for us</p>
      <p class="ln">So I kept running toward the sun</p>
      <div class="dots"><i></i><i></i><i></i></div>
      <p class="ln">Hold on, the city's burning slow</p>
    </div>
    <div class="minimeta">
      <div class="art sl10 edge" data-art="electric-dusk" style="width:56px;height:56px"></div>
      <div style="flex:1;min-width:0"><div class="tt ell">Electric Dusk</div><div class="ar ell">Halcyon Drift</div></div>
      <div class="ib" style="color:#fff"><i class="g s28" data-g="heart"></i></div>
    </div>
    <div class="seekwrap">
      <div style="height:54px;display:flex;align-items:flex-end;padding-bottom:5px"><div class="seek" data-w="364" data-h="28" data-p=".33" data-c="#FFB0CD" data-t="rgba(255,255,255,.24)" data-ph="1.2"></div></div>
      <div class="times"><span>1:04</span><span>−2:11</span></div>
    </div>
    <div class="transport">
      <div class="ib lit" style="--lit:var(--dyn)"><i class="g" data-g="shuffle"></i></div>
      <div class="disc glass" style="width:64px;height:64px"><i class="g s28" data-g="prev"></i></div>
      <div class="disc play" style="width:88px;height:88px"><span class="glyph" data-t="1" data-s="34" data-c="#5E1133"></span></div>
      <div class="disc glass" style="width:64px;height:64px"><i class="g s28" data-g="next"></i></div>
      <div class="ib"><i class="g" data-g="repeat"></i></div>
    </div>
    <div class="actions">
      <div class="capsule"><i class="g s20" data-g="speaker"></i>This phone</div>
      <div style="display:flex;gap:4px"><div class="ib"><i class="g" data-g="moon"></i></div><div class="ib lit" style="--lit:var(--dyn)"><i class="g" data-g="lyrics"></i></div></div>
    </div>
    <div class="upnext">
      <div class="art sl8" data-art="desert-bloom" style="width:36px;height:36px"></div>
      <div class="tx"><div class="a">Up next</div><div class="b ell">Desert Bloom · Kaveh Rostami</div></div>
      <i class="g s20" data-g="chevu" style="opacity:.7"></i>
    </div>
  </div>
  <div class="gesture" style="--gh:#fff"></div>
</div>
<script src="lib.js"></script><script>buildMock()</script></body></html>
