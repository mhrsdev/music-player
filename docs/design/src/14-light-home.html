<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Home light</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="home.css"></head>
<body><div class="screen theme-light" style="--glow:176,110,210">
  <div class="glow"></div>
  <div class="statusbar"></div>
  <div class="content">
    <div class="sec" style="margin-top:14px"><div class="t-section">Recently added</div><div class="act">See all<i class="g s18" data-g="chev"></i></div></div>
    <div class="car">
      <div class="art sl16 edge" data-art="tehran-nights" style="left:20px;width:264px">
        <div class="disc play-sm playd" style="background:#E3B6FF;color:#4A1A6B;box-shadow:0 0 0 6px rgba(227,182,255,.16),0 10px 22px -6px rgba(40,0,60,.8)"><i class="g s28" data-g="play"></i></div>
      </div>
      <div class="art sl14 edge" data-art="electric-dusk" style="left:292px;width:84px"></div>
      <div class="art sl12 edge" data-art="koucheh-bagh" style="left:384px;width:40px"></div>
    </div>
    <div class="cap fa" dir="rtl" style="text-align:left"><div class="t-title ell">شب‌های تهران</div><div class="t-meta ell">آوا نیک‌زاد · آلبوم · ۱۲ آهنگ</div></div>

    <div class="sec" style="margin-top:22px"><div class="t-section">Throwbacks</div><div class="act">See all<i class="g s18" data-g="chev"></i></div></div>
    <div class="mixes">
      <div class="mix" style="--lab:#ff7aa8"><div class="rec"></div><div class="art sl10" data-art="mix-2016"></div><div class="t-title ell">On repeat, 2016</div><div class="t-meta ell">42 songs you loved</div></div>
      <div class="mix" style="--lab:#d9573a"><div class="rec"></div><div class="art sl10" data-art="mix-fa"></div><div class="t-title ell fa" dir="rtl" style="text-align:left">دهه‌ی هشتاد</div><div class="t-meta ell fa" dir="rtl" style="text-align:left">۵۸ آهنگ · ۱۳۸۰ تا ۱۳۸۹</div></div>
      <div class="mix" style="--lab:#0f8a8a"><div class="rec"></div><div class="art sl10" data-art="mix-summer"></div><div class="t-title ell">Summer of 2019</div><div class="t-meta ell">31 songs</div></div>
    </div>

    <div class="sec" style="margin-top:20px"><div class="t-section">Quick picks</div><div class="act"><i class="g s18" data-g="shuffle"></i>&nbsp;Shuffle</div></div>
    <div class="row"><div class="art sl8 edge" data-art="without-you" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell">Without You</div><div class="t-meta ell">NEFFEX</div></div><div class="d">3:10</div><div class="ib more"><i class="g" data-g="more"></i></div></div>
    <div class="row"><div class="art sl8 edge" data-art="anar" style="width:48px;height:48px"></div><div class="txt fa" dir="rtl" style="text-align:left"><div class="t-title ell">انار</div><div class="t-meta ell">سامان آرین</div></div><div class="d">4:21</div><div class="ib more"><i class="g" data-g="more"></i></div></div>
    <div class="row"><div class="art sl8 edge" data-art="topography" style="width:48px;height:48px"></div><div class="txt"><div class="t-title ell">Cold Light</div><div class="t-meta ell">Mira Vale</div></div><div class="d">3:47</div><div class="ib more"><i class="g" data-g="more"></i></div></div>
  </div>
  <div class="deckwrap"></div>
  <div class="deck" data-on="home"></div>
  <div class="gesture"></div>
</div>
<script src="lib.js"></script><script>buildMock()</script></body></html>
