<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Player bars</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="player.css">
<style>
  .screen { --dyn: #FFB3B1; --on-dyn: #5F1416; --dyn-shadow: rgba(170,20,30,.8); --tintc: #9e1a26; }
  .scrim { background: linear-gradient(180deg, rgba(26,4,7,.36) 0%, rgba(26,4,7,.2) 34%, rgba(26,4,7,.6) 58%, rgba(26,4,7,.88) 100%); }
</style></head>
<body><div class="screen theme-dark pl">
  <div class="backdrop"><div class="art" data-art="anar"></div></div>
  <div class="tint"></div><div class="backdrop-scrim scrim"></div><div class="grain"></div>
  <div class="layer">
    <div class="statusbar"></div>
    <div class="top">
      <div class="ib"><i class="g" data-g="chevd"></i></div>
      <div class="from"><div class="a">Playing from</div><div class="b">Liked songs</div></div>
      <div class="ib"><i class="g" data-g="more"></i></div>
    </div>
    <div class="cover-glow" style="left:56px;top:150px;width:300px;height:330px"><div class="art" data-art="anar"></div></div>
    <div class="cover art sl20 edge" data-art="anar"></div>
    <div class="meta" style="opacity:.38">
      <div style="min-width:0;flex:1"><div class="t-display fa ell" dir="rtl" style="text-align:left">انار</div><div class="artist fa" dir="rtl" style="text-align:left;font-family:Vazirmatn">سامان آرین</div></div>
      <div class="ib" style="color:var(--dyn)"><i class="g s28" data-g="heart.f"></i></div>
    </div>
    <div class="seekwrap">
      <div style="position:relative"><div class="seek" data-w="364" data-h="44" data-p=".52" data-style="bars" data-c="#FFB3B1" data-t="rgba(255,255,255,.26)" data-seed="12" data-lens=".52" style="padding-top:5px"></div>
        <div class="bubble" style="left:189px;top:-44px">2:16<small>of 4:21</small></div>
        <div class="finger" style="left:189px;top:27px"></div></div>
      <div class="times" style="margin-top:9px"><span>2:16</span><span>−2:05</span></div>
    </div>
    <div class="transport">
      <div class="ib"><i class="g" data-g="shuffle"></i></div>
      <div class="disc glass" style="width:64px;height:64px"><i class="g s28" data-g="prev"></i></div>
      <div class="disc play" style="width:88px;height:88px"><span class="glyph" data-t="1" data-s="34" data-c="#5F1416"></span></div>
      <div class="disc glass" style="width:64px;height:64px"><i class="g s28" data-g="next"></i></div>
      <div class="ib lit" style="--lit:var(--dyn)"><i class="g" data-g="repeat"></i></div>
    </div>
    <div class="actions">
      <div class="capsule"><i class="g s20" data-g="speaker"></i>JBL Charge 6</div>
      <div style="display:flex;gap:4px"><div class="ib lit" style="--lit:var(--dyn)"><i class="g" data-g="moon.f"></i></div><div class="ib"><i class="g" data-g="lyrics"></i></div></div>
    </div>
    <div class="upnext">
      <div class="art sl8" data-art="baran" style="width:36px;height:36px"></div>
      <div class="tx"><div class="a">Up next · sleep in 23 min</div><div class="b ell"><span class="fa" style="font-family:Vazirmatn">باران که می‌آید</span> · <span class="fa" style="font-family:Vazirmatn">نیلوفر</span></div></div>
      <i class="g s20" data-g="chevu" style="opacity:.7"></i>
    </div>
  </div>
  <div class="gesture" style="--gh:#fff"></div>
</div>
<script src="lib.js"></script><script>buildMock()</script></body></html>
