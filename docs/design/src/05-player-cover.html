<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Player</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="player.css">
<style>
  .screen { --dyn: #A9D4F5; --on-dyn: #00344D; --dyn-shadow: rgba(20,90,140,.75); --tintc: #1f5f86; }
  .scrim { background: linear-gradient(180deg, rgba(4,14,26,.34) 0%, rgba(4,14,26,.18) 34%, rgba(4,14,26,.58) 58%, rgba(4,14,26,.86) 100%); }
</style></head>
<body><div class="screen theme-dark pl">
  <div class="backdrop"><div class="art" data-art="without-you"></div></div>
  <div class="tint"></div><div class="backdrop-scrim scrim"></div><div class="grain"></div>
  <div class="layer">
    <div class="statusbar"></div>
    <div class="top">
      <div class="ib"><i class="g" data-g="chevd"></i></div>
      <div class="from"><div class="a">Playing from artist</div><div class="b">NEFFEX</div></div>
      <div class="ib"><i class="g" data-g="more"></i></div>
    </div>
    <div class="cover-glow" style="left:56px;top:150px;width:300px;height:330px"><div class="art" data-art="without-you"></div></div>
    <div class="cover art sl20 edge" data-art="without-you"></div>
    <div class="meta">
      <div style="min-width:0;flex:1"><div class="t-display ell">Without You</div><div class="artist">NEFFEX</div></div>
      <div class="ib" style="color:var(--dyn)"><i class="g s28" data-g="heart.f"></i></div>
    </div>
    <div class="seekwrap">
      <div class="seek" data-w="364" data-h="54" data-p=".36" data-style="waveform" data-c="#A9D4F5" data-t="rgba(255,255,255,.11)" data-seed="8"></div>
      <div class="times"><span>1:05</span><span>−1:56</span></div>
    </div>
    <div class="transport">
      <div class="ib lit" style="--lit:var(--dyn)"><i class="g" data-g="shuffle"></i></div>
      <div class="disc glass" style="width:64px;height:64px"><i class="g s28" data-g="prev"></i></div>
      <div class="disc play" style="width:88px;height:88px"><span class="glyph" data-t="1" data-s="34" data-c="#00344D"></span></div>
      <div class="disc glass" style="width:64px;height:64px"><i class="g s28" data-g="next"></i></div>
      <div class="ib lit" style="--lit:var(--dyn)"><i class="g" data-g="repeat1"></i></div>
    </div>
    <div class="actions">
      <div class="capsule"><i class="g s20" data-g="speaker"></i>JBL Charge 6</div>
      <div style="display:flex;gap:4px"><div class="ib"><i class="g" data-g="moon"></i></div><div class="ib"><i class="g" data-g="lyrics"></i></div></div>
    </div>
    <div class="upnext">
      <div class="art sl8" data-art="grateful" style="width:36px;height:36px"></div>
      <div class="tx"><div class="a">Up next</div><div class="b ell">Grateful · NEFFEX</div></div>
      <i class="g s20" data-g="chevu" style="opacity:.7"></i>
    </div>
  </div>
  <div class="gesture" style="--gh:#fff"></div>
</div>
<script src="lib.js"></script><script>buildMock()</script></body></html>
